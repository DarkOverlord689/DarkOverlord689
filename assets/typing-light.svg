<svg xmlns="http://www.w3.org/2000/svg" width="640" height="62" viewBox="0 0 640 62" role="img" aria-labelledby="title desc">
<title id="title">AI Engineering · Backend · Automation · DevOps</title><desc id="desc">Specialties from the profile, animated locally with CSS. No external typing service or JavaScript.</desc>
<defs><linearGradient id="signal" x2="1" y2="1">
<stop stop-color="#006c83"/><stop offset=".6" stop-color="#175ad0"/><stop offset="1" stop-color="#6944ba"/></linearGradient>
